# One-use, same-repository build step for this explicitly requested revision.
# Its patch is removed by the build; the workflow is removed before merging.
name: prepare-audit-revision

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: prepare-audit-revision-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'revision/audit-exposition-2026-10-07'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install TeX noninteractively with a time limit
        timeout-minutes: 8
        run: |
          sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 360s apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern python3-pip
      - name: Install Python dependency
        timeout-minutes: 2
        run: python3 -m pip install --timeout 30 --retries 2 --break-system-packages -r requirements.txt
      - name: Apply the locally reviewed, fingerprinted source revision
        run: |
          test "$(git hash-object paper/factorial_conjecture_two_variables.tex)" = fd381763cb68294bca0110c7503d8dd43efdfd70
          git apply --unidiff-zero --check .github/revision-audit.patch
          git apply --unidiff-zero .github/revision-audit.patch
          echo 'fa34365a4f872b9ccd29e67d6173ae745db2cf8a395e2257afd984912144eee1  paper/factorial_conjecture_two_variables.tex' | sha256sum --check
      - name: Verify and build the tracked snapshot
        run: |
          make test
          make snapshot
          make snapshot-check
      - name: Commit only this revision and remove the source patch
        env:
          BRANCH: ${{ github.head_ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          rm .github/revision-audit.patch
          git add -A -- paper/factorial_conjecture_two_variables.tex factorial_conjecture_two_variables.pdf verification/pdf_snapshot.json .github/revision-audit.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply audited exposition revision and refresh manuscript PDF'
          git push origin "HEAD:refs/heads/$BRANCH"
