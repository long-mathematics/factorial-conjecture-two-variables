name: refresh-integral-mathieu-snapshot

on:
  push:
    branches:
      - revision/integral-mathieu-2026-10-07

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: revision/integral-mathieu-2026-10-07

      - name: Install TeX
        timeout-minutes: 12
        run: |
          sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 600s apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern python3-pip

      - name: Refresh tracked manuscript PDF
        run: make snapshot

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factorial_conjecture_two_variables.pdf verification/pdf_snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot already current."
          else
            git commit -m "Refresh manuscript PDF snapshot"
            git push origin HEAD:revision/integral-mathieu-2026-10-07
          fi
